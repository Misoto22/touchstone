name = "nextjs"
version = "1"
category = "framework"
supported = ">=13,<17"
audit_context = "Inspect Next.js routing, rendering, caching, and server/client boundaries."
protected_paths = ["next.config.js", "next.config.mjs", "next.config.ts"]
source_paths = ["app/", "pages/", "src/"]

[[detect]]
kind = "dependency"
ecosystem = "node"
name = "next"

[[validation]]
argv = ["npm", "run", "build"]
timeout_seconds = 1200
capability = "application-build"
enabled = false
