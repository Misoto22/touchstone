name = "django"
version = "1"
category = "framework"
supported = ">=4,<6"
audit_context = "Inspect Django models, migrations, permissions, views, and transactions."
protected_paths = ["migrations/"]
source_paths = ["src/", "apps/"]

[[detect]]
kind = "dependency"
ecosystem = "python"
name = "django"

[[validation]]
argv = ["python", "manage.py", "check"]
timeout_seconds = 600
capability = "application-settings"
enabled = false
