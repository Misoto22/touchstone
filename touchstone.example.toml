# Generated shape for a generic repository. `touchstone init` discovers the
# repository and writes these values for the current project.
version = 1

[project]
# Relative paths resolve from this file, not from the invoking shell.
path = "."

[forge]
provider = "github"
# Optional when `origin` points at GitHub; discovery fills it during init.
slug = "owner/repository"
default_branch = "main"
required_workflows = ["ci.yml"]
escalation_label = "touchstone:needs-review"
reap_after_hours = 6

[engine]
name = "codex" # codex | claude
model = "gpt-5.6-sol"
audit_effort = "high"
review_effort = "high"
timeout_seconds = 2700

[engine.budget]
# Enforced by Claude. Codex currently reports no cost, so its ceiling is time.
audit = 20.0
review = 4.0

[execution]
target = "local" # local | ssh

# Required only when execution.target = "ssh".
[execution.ssh]
host = "audit-host"
workdir = "/srv/touchstone/repository"
state_dir = "/srv/touchstone/state"
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }

[loop.code]
brief = "builtin:code-audit"
label = "touchstone:audit"
schedule = "hourly"
protected_paths = [
    ".github/",
    ".env",
    ".env.*",
    "migrations/",
    "AGENTS.md",
]

[loop.code.context]
project = "this repository and its data model"
ledger = "No project findings ledger is configured; treat the queue as empty."
protected = "the configured protected paths"
rules_clause = ""
