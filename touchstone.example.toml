# Project-owned schema-v2 example. `touchstone init` normally writes this file
# and its generated companion from live repository evidence.
version = 2
generated = "touchstone.generated.example.toml"
timezone = "Australia/Sydney"

[project]
path = "."

[forge]
provider = "github"
slug = "owner/repository"
default_branch = "main"
required_workflows = ["ci.yml"]
escalation_label = "touchstone:needs-review"
reap_after_hours = 6

# Exactly one project Harness. Embedded keeps a fresh clone self-contained.
[harness]
mode = "embedded"
entrypoint = "AGENTS.md"

# External alternative; keep the checkout path in the user-level registry:
# [harness]
# mode = "external"
# source = "Efficient-Pty-Ltd/efficient-harness"
# ref = "origin/main"
# entrypoint = "harness/00-INDEX.md"

[engine]
name = "codex" # codex | claude
model = "your-model-id"
audit_effort = "high"
review_effort = "high"
timeout_seconds = 2700
# An OpenAI-compatible or Anthropic-compatible endpoint instead of the vendor's
# own. Omit for the vendor default. The key still arrives through the usual
# environment variable; this is an address, never a credential.
# base_url = "https://api.minimax.io/anthropic"   # with engine.name = "claude"
# wire_api = "responses"                          # Codex only; "chat" is gone

[engine.budget]
# Enforced by Claude. Codex reports no cost, so its ceiling is time.
audit = 20.0
review = 4.0

# Any other subtable of [engine] is a named pool member a Loop can run on. The
# unnamed engine above is the member called `default`, so a configuration that
# never names a second one keeps working unchanged. Members exist because the
# loops do different work: hunting hardcoded values is cheap and mechanical,
# judging naming is neither, and paying the strong model's rate for both is a
# decision nobody made on purpose.
# [engine.cheap]
# name = "claude"
# model = "your-small-model-id"
#
# [engine.gateway]
# name = "claude"
# model = "your-model-id"
# base_url = "https://gateway.example.test/anthropic"
# Two members can speak the same API and hold different credentials, so a
# member reaching a gateway names the variable its key arrives in. This is a
# variable name, never a value.
# api_key_env = "GATEWAY_API_KEY"
# Where the operator's own secret store holds that key. Touchstone never reads
# it; `doctor` prints the command that would, so the value never enters a
# Touchstone process.
# api_key_ref = "op://vault/item/credential"

[git]
# Two identities take part in a published change: the bot that ran the Loop and
# the operator who owns the repository. A commit has room for one author, so
# this names which of them git records; the other is credited in a
# `Co-Authored-By` trailer, which is what the forge reads back into contributor
# history. Omit the operator pair entirely and nobody is credited, which is the
# behavior a configuration without this section already had.
author = "bot" # bot | operator
# The bot identity a local run uses. A hosted run supplies the publishing App's
# own identity instead, because only GitHub knows the login it minted.
author_name = "touchstone[bot]"
author_email = "touchstone[bot]@users.noreply.github.com"
# Use the forge's noreply address, not a personal one: GitHub links a commit to
# an account through `<id>+<login>@users.noreply.github.com` and shows it in
# contributor history. A personal address reads as a human in `git log` and as
# nobody in the contributor graph.
operator_name = "your-github-login"
operator_email = "0000000+your-github-login@users.noreply.github.com"

[execution]
target = "local" # local | ssh

# Required only when execution.target = "ssh".
[execution.ssh]
host = "audit-host"
workdir = "/srv/touchstone/repository"
state_dir = "/srv/touchstone/state"
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }

[actions]
visibility = "public" # must match the live repository for doctor checks
wake_minutes = 15
artifact_retention_days = 90
node_version = "24"
auto_merge = false
# How the forge is asked to merge. The repository decides which of these it
# permits; `doctor` compares the two and names the mismatch, because attempting
# a forbidden one fails after the pull request already exists.
# auto_merge_strategy = "squash"   # squash | merge | rebase
# auto_merge_delete_branch = true
# When an unattended merge may be armed, in this configuration's timezone. No
# window means no restriction. This bounds when Touchstone hands the merge to
# the forge, not when the forge completes it: `--auto` merges once the required
# checks pass, which can be later.
# auto_merge_window = ["MON-THU,09:00-17:00", "FRI,09:00-12:00"]
# Above this many changed files, the pull request waits for a person. Zero is
# no limit. Files rather than lines: file count is the scale on which someone
# judges whether a diff can be read in one sitting.
# auto_merge_max_files = 5

[loop.code]
# Which pool member this Loop runs on. Omit for the unnamed engine.
# engine = "cheap"
# A built-in brief names one concern and no technology; the Target's Profile
# Set supplies the stack. Available: code-audit, harness-review, hardcode,
# naming, error-handling, test-coverage. A path instead of `builtin:` reads a
# brief the repository owns, whose sibling `review.md` reviews it.
brief = "builtin:code-audit"
label = "touchstone:audit"
schedule = "hourly@00"
targets = ["repository"]
protected_paths = ["migrations/"]
# Whether an open draft holds this loop's pull-request slot. False for a code
# audit: it parks a medium-risk finding as a draft, a parked draft waits for a
# person and is never reaped, so a loop whose drafts held the slot would stop
# at its first medium-risk finding. Set it true for a loop that must never have
# more than one pull request open, draft or not.
drafts_hold_slot = false
# Whether this Loop's approved low-risk pull requests merge without a person.
# Per Loop, never per project. Requires every condition at publication time —
# low risk, an approving independent review, a ready pull request, passing
# Gates, a repository that allows auto-merge, a declared required workflow, and
# a protected base branch — and a backend whose Verify stage holds no model
# credential, which today means GitHub Actions. Anywhere else it is refused.
auto_merge = false

# The counts the register carries have to come from the project's own tooling,
# not from the session reading the repository and estimating. Without this the
# brief asks for a measurement nobody took.
[[loop.code.attachment]]
heading = "The current rule census"
command = ["just", "census"]

[loop.code.context]
project = "this repository and its data model"
register = "the rule register in `docs/engineering/rules.md`"
rules_clause = ""
