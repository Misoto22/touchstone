version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-non-major:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The Harness workflow is hash-locked in .rulesync/managed-files.json; its
    # pins reach this repository through a Harness release and re-render.
    exclude-paths:
      - ".github/workflows/misoto-harness.yml"
    groups:
      actions-non-major:
        update-types: [minor, patch]
