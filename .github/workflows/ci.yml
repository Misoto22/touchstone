name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Check graph documentation
        run: touchstone graph --check

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: >-
          python -m pytest
          tests/test_distribution.py
          tests/test_stack_actions_acceptance.py
          -q

  agent-runtime:
    name: Locked Agent runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.3.0
        with:
          node-version: "24"
      - name: Smoke-test locked Codex CLI
        working-directory: agent-runtime/codex
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node_modules/.bin/codex --version
      - name: Smoke-test locked Claude Code CLI
        working-directory: agent-runtime/claude
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node node_modules/@anthropic-ai/claude-code/install.cjs
          node_modules/.bin/claude --version
