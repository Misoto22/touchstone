name: Misoto Harness

# The checker also judges the whole repository: lock files and their updaters,
# runtime pins, and the files that project rules name as checks. Any change
# can move those results, so the job runs on every pull request and push to
# main without path filters, and weekly so that an exception or a pending
# check that expires is reported even when nothing changed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

# Supersede a pull request's own earlier runs; let a push to main finish so
# the default branch always records a complete drift check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
