# The drift check reads only the Harness-managed contract: the Rulesync
# sources and manifest under `.rulesync/`, the Rulesync configuration and
# lock, the root and nested `AGENTS.md`, `CLAUDE.md`, and `GEMINI.md`
# adapters, the Cursor rule files, and this workflow. A change that touches
# none of them cannot produce drift, so the job does not run for it. Keep
