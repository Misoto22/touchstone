# prettier-ignore
name: Misoto Harness

# The checker also judges the whole repository: file sizes, lock files and
# their updaters, runtime pins, and the files that project rules name as
# checks. Any change can move those results, so the job runs on every pull
# request and push to main without path filters, and weekly so that an
# exception or a pending check that expires is reported even when nothing
# changed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

# Supersede a pull request's own earlier runs; let a push to main finish so
# the default branch always records a complete drift check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          # The rulesync toolchain installs through pnpm below; leave the consumer
          # repository's own package manager cache alone.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .rulesync/package.json
      - run: python .rulesync/harness-check.py
        env:
          # A scheduled run has no event base, so it checks history up to its own commit.
          MISOTO_HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      - run: pnpm --dir .rulesync install --frozen-lockfile
      - run: ./.rulesync/node_modules/.bin/rulesync generate --check --silent
