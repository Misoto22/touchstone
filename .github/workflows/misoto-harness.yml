      - ".rulesync/**"
      - "rulesync.jsonc"
      - "rulesync.lock.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/GEMINI.md"
      - ".cursor/rules/**"
      - ".github/workflows/misoto-harness.yml"

permissions:
  contents: read

jobs:
