name: Touchstone hosted stage
description: Run one credential-isolated Touchstone hosted stage
inputs:
  stage:
    description: One of prepare, analysis, publish, or snapshot
    required: true
  version:
    description: Exact touchstone-agent package version
    required: true
runs:
  using: composite
  steps:
    - name: Run Touchstone stage
      shell: bash
      run: '$GITHUB_ACTION_PATH/scripts/action-entrypoint.sh "${{ inputs.stage }}" "${{ inputs.version }}"'
