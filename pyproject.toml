[project]
name = "touchstone-agent"
version = "0.1.2"
description = "Scheduled agent loops that audit a repository and the harness that judges it"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "audit", "github", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "cryptography>=44.0",
    "langgraph>=1.0",
    # SQLite, not Postgres. The loop's value depends on it not sharing fate
    # with the system it audits, and a checkpoint file next to the ledger is
    # one fewer thing that can be down when the loop needs to run.
    "langgraph-checkpoint-sqlite>=2.0",
    "packaging>=24.0",
    "tomli-w>=1.2",
]

[project.urls]
Homepage = "https://github.com/Misoto22/touchstone"
Issues = "https://github.com/Misoto22/touchstone/issues"
Changelog = "https://github.com/Misoto22/touchstone/blob/main/CHANGELOG.md"

[project.scripts]
touchstone = "touchstone.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "pytest>=8.0",
    "ruff>=0.9",
    "twine>=6.2",
    # The Studio server. Kept out of the runtime dependencies: a scheduled
    # unattended run has no use for a web UI.
    "langgraph-cli[inmem]>=0.2",
    # `draw_ascii` only. `draw_mermaid` needs nothing.
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]

[tool.hatch.build]
artifacts = [
    "src/touchstone/resources/briefs/*.md",
    "src/touchstone/resources/profiles/*.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
