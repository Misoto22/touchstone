[project]
name = "touchstone"
version = "0.1.0"
description = "Scheduled agent loops that audit a repository and the harness that judges it"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    # SQLite, not Postgres. The loop's value depends on it not sharing fate
    # with the system it audits, and a checkpoint file next to the ledger is
    # one fewer thing that can be down when the loop needs to run.
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.scripts]
touchstone = "touchstone.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    # The Studio server. Kept out of the runtime dependencies: a scheduled
    # unattended run has no use for a web UI.
    "langgraph-cli[inmem]>=0.2",
    # `draw_ascii` only. `draw_mermaid` needs nothing.
    "grandalf>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone"]

[tool.hatch.build]
artifacts = ["src/touchstone/resources/briefs/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
